name: watch-internships

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-internships
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip at job start, not the triggering commit: a run
      # queued behind another (Worker dispatch + cron, or a manual run) would
      # otherwise start from the pre-run state.json and re-post everything the
      # run ahead of it just posted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python run_once.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          DISCORD_CYBER_WEBHOOK_URL: ${{ secrets.DISCORD_CYBER_WEBHOOK_URL }}
          DISCORD_CYBER_ROLE_ID: ${{ secrets.DISCORD_CYBER_ROLE_ID }}

      - name: commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: update seen listings"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi
